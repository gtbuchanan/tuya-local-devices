---
jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: gtbuchanan/tooling/.github/actions/mise-setup@cc8db05d356667bcff53d990ecee5a96a527f03c # v1.0.0
      - env:
          # compile authenticates its upstream-release lookup with this, so a
          # shared runner IP's spent anonymous rate limit cannot fail the build.
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_VERSION: ${{ inputs.upstream_version }}
        # test:deps compiles the merged tree and installs upstream's test
        # harness (the same leaf task prepare uses locally); build:ci then runs
        # compile (cached) + the fast tests.
        run: |
          mise run test:deps
          mise run build:ci
name: CI

on:
  workflow_call:
    inputs:
      upstream_version:
        default: ''

        description: Upstream tuya-local release to build + test (empty = latest).
        required: false
        type: string
permissions:
  contents: read
