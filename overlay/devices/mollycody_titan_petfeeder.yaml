---
entities:
  - category: config
    dps:
      # Base64 of up to 10 repetitions of a 5-byte meal record, per the
      # format documented on the sibling arlec_5l/catit_pixi feeders.
      # Unverified on this unit — the dp is not returned by a status
      # query, so no live value has been observed to decode against:
      # - Date (1 bit per day Monday -> Sunday, padded with 0 on the MSB).
      #    Ex: Monday, Wednesday, Sunday -> 0b01010001
      # - Hour
      # - Minute
      # - Feed portions
      # - Enable/Disabled
      # The schedule demonstrably runs on the device, so the value
      # exists, but nothing local reaches it: the dp is absent from
      # status replies and the device ignores an explicit dp query, so
      # enabling this entity yields an empty box.
      - id: 1
        name: value
        optional: true
        type: base64
    entity: text
    hidden: true
    translation_key: meal_plan
  - dps:
      - id: 2
        name: button
        optional: true
        type: boolean
    entity: button
    icon: 'mdi:food-drumstick'
    # Dispenses exactly one portion, which is a small fraction of a
    # normal meal here — named for what it does rather than upstream's
    # "Quick feed", which reads like a full serving. Singular here
    # against the plural on dp 3, which takes a count.
    name: Dispense portion
  - dps:
      - id: 3
        name: value
        optional: true
        range:
          max: 60
          min: 1
        type: integer
        unit: portions
    entity: number
    # Icon set explicitly because naming the entity drops the
    # manual_feed translation key, which is what supplied it upstream.
    icon: 'mdi:food-drumstick'
    # Writing this dp dispenses immediately — it is a command, not a
    # stored setting. Presented as a box rather than the default slider
    # so it takes a typed, committed value: dragging a slider would feed
    # the animals on every accidental touch.
    mode: box
    name: Dispense portions
  - class: enum
    dps:
      - id: 4
        mapping:
          - dps_val: standby
            value: standby
          - dps_val: feeding
            value: feeding
          - dps_val: done
            value: feeding_complete
        name: sensor
        type: string
    entity: sensor
    translation_key: status
  - category: diagnostic
    class: battery
    dps:
      - id: 10
        mapping:
          # The feeder only reports a real percentage while running on
          # battery; on mains it sends a constant 0. Left alone that
          # surfaces as a permanently flat battery and trips HA's
          # low-battery alerting, so report no value instead. A genuine
          # 0% reading is lost, but the feeder is dead by then anyway.
          - dps_val: 0
            value: null
        name: sensor
        type: integer
        unit: '%'
    entity: sensor
  # No entity for dp 11 (charge_state). Upstream exposes it as a
  # battery_charging binary_sensor defaulting to false, but this feeder
  # has no rechargeable cell — it runs on mains or on battery — and the
  # dp has never been transmitted. Reinstate it if one is ever observed.
  - category: diagnostic
    class: opening
    dps:
      # Does not track the lid. Reported 'on' in full polls with the lid
      # physically off, having read 'on' across thousands of polls with
      # it on, through every feed cycle, and with the whole food bin
      # removed. The mapping below reads 'on' as closed, which the
      # lid-off reading contradicts outright.
      #
      # A single 'off' push was seen once, seconds before the device
      # dropped off the network and stayed unreachable for weeks. It is
      # treated as noise from a failing connection rather than a cover
      # event -- nothing else has ever moved this dp.
      #
      # Registered disabled: the dp is real and reported, but nothing
      # has tied it to anything physical. Upstream's mapping is left
      # alone rather than inverted, since 'off' has no confirmed meaning
      # either and guessing again would not improve on it.
      - id: 12
        mapping:
          - dps_val: 'on'
            value: false
          - dps_val: 'off'
            value: true
        name: sensor
        type: string
    entity: binary_sensor
    hidden: true
    name: Cover
  - category: diagnostic
    class: enum
    dps:
      # Reports the fault as readable text rather than upstream's generic
      # problem boolean, so a notification can use the state directly.
      # Bitfield matching is a bitwise AND and the first match wins, so
      # with several bits set only the lowest is named — fault_code below
      # carries the full value. The trailing default catches any bit the
      # device sets that is not documented here, which would otherwise
      # go unreported.
      - id: 13
        mapping:
          # Absent dp means no reading, not an unrecognised fault -- the
          # trailing default would otherwise report one.
          - dps_val: null
            value: null
          - dps_val: 0
            value: ok
          - dps_val: 1
            value: jammed
          - dps_val: 2
            value: food_low
          - dps_val: 4
            value: food_empty
          - dps_val: 8
            value: desiccant_low
          - dps_val: 16
            value: battery_low
          - dps_val: 32
            value: stuck
          # No mapping for bit 64. Upstream labels it battery_powered,
          # but this feeder left it clear while running on battery
          # during a deliberate mains disconnection, so that meaning is
          # disproven here. It falls through to unknown_fault, which is
          # the honest answer until something sets it.
          - value: unknown_fault
        name: sensor
        type: bitfield
      - id: 13
        name: fault_code
        type: bitfield
    entity: sensor
    name: Fault
  - dps:
      # 2 (food_low) | 4 (food_empty). Upstream watches bit 4 alone, but
      # this feeder reports bit 2 for an empty hopper and has never been
      # observed to set bit 4 — not while empty, and not on a dispense
      # attempt that ran dry. Matching both keeps the sensor meaningful
      # here without assuming bit 4 is unused.
      #
      # This is the only dp 13 bit whose meaning has been confirmed on
      # this device, so it is the only one given a dedicated entity. The
      # rest are decoded by the Fault sensor above, where a wrong guess
      # is visible as text next to the raw fault_code rather than
      # asserted as a named binary state.
      - id: 13
        mapping:
          # The dp goes absent across a power cycle or a reload and only
          # returns when the fault state changes. Without this the
          # catch-all below answers "OK" for "no reading", which is the
          # one wrong answer a food sensor must not give.
          - dps_val: null
            value: null
          - dps_val: 6
            value: true
          - value: false
        name: sensor
        type: bitfield
    entity: binary_sensor
    # Not diagnostic: whether there is food to dispense is the feeder's
    # primary state, not a fact about the device's own health.
    #
    # The tank_empty translation key is kept for its state strings only
    # -- OK and Low, rather than the bare On/Off a classless binary
    # sensor would show. The name overrides that key's own "Tank", which
    # says nothing about what is in it. A problem device class was
    # considered and dropped: it would force HA's fixed OK/Problem
    # wording over the clearer OK/Low.
    name: Food level
    translation_key: tank_empty
  - category: diagnostic
    dps:
      # Never observed to report. Silent through a quick feed, a manual
      # dispense, a dispense that ran dry, and a scheduled meal-plan
      # feed that ran its full two-minute cycle and delivered food. The
      # only value ever seen was 25, read by localtuya during pairing,
      # which matched the schedule then configured -- hence the guess
      # that it holds the last feed size.
      #
      # Upstream exposes this as an event entity, which cannot fire at
      # all given the above. A sensor at least holds the value if one
      # ever arrives, and cannot misfire the way a stale event would.
      #
      # No unit: the vendor declares feed_report as a bare 0-100 integer
      # with none, and portions is only an inference from that single
      # reading. Registered disabled, like the other dps this firmware
      # declares but does not use.
      - class: measurement
        id: 14
        name: sensor
        type: integer
    entity: sensor
    hidden: true
    name: Last feed
  - category: config
    dps:
      - id: 17
        name: switch
        type: boolean
    entity: switch
    # Keeps the feeder's screen permanently lit; off leaves it to
    # illuminate only on use. Upstream models this as a light, which
    # puts a lamp with brightness semantics in the device's main
    # controls and sweeps it into "all lights off" automations. It is a
    # display preference, so it is a config switch here.
    icon: 'mdi:television-ambient-light'
    name: Always-on display
  - category: config
    dps:
      - id: 23
        name: switch
        type: boolean
    entity: switch
    name: Slow feed
  - category: config
    dps:
      - id: 24
        name: button
        optional: true
        type: boolean
    entity: button
    hidden: true
    translation_key: factory_reset
  - category: config
    dps:
      - id: 26
        name: switch
        type: boolean
    entity: switch
    hidden: true
    icon: 'mdi:bell-alert'
    # The Tuya code for this dp is weight_calibrate, but the vendor app
    # presents it as "food shortages remind" and that is what it does --
    # the code name looks like residue from whatever template the
    # product was built from. Named for the behaviour, not the code.
    #
    # Registered disabled because the reminder it gates is delivered by
    # Tuya's cloud to their app, so nothing it produces reaches Home
    # Assistant. The toggle itself is a real device setting, which is
    # why it stays available rather than being dropped: enable it to
    # silence the app's nagging without opening the app.
    name: Food shortage reminder
  - category: diagnostic
    class: enum
    dps:
      # Reports which supply the feeder is running on, not a setting.
      # Upstream models this as a select; writing strong_power to the
      # device was accepted without error and silently ignored, and the
      # dp only ever changes on its own (it reported battery_power
      # throughout a mains outage). Duplicates the plug binary_sensor,
      # which derives the same fact from dp 13 bit 64.
      - id: 101
        mapping:
          - dps_val: strong_power
            value: mains
          - dps_val: battery_power
            value: battery
        name: sensor
        type: string
    entity: sensor
    icon: 'mdi:power-plug'
    name: Power source
name: Molly&Cody Smart Feeder Titan
products:
  - id: gh0lmtxb5fumm0ad
    manufacturer: Molly&Cody
    model: M&C Smart Feeder Titan WIFI
