allowBuilds:
  esbuild: true
  unrs-resolver: false

catalog:
  '@gtbuchanan/eslint-config': 0.5.0
  '@gtbuchanan/tsconfig': 0.2.0
  '@types/node': 26.2.0
  eslint: 10.9.0
  jiti: 2.6.1
  typescript: 6.0.3

engineStrict: true

hoist: false

lockfileIncludeTarballUrl: false

# 4320 minutes = 3 days, matching the shared Renovate preset's quarantine.
minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - '@gtbuchanan/*'

strictPeerDependencies: true
